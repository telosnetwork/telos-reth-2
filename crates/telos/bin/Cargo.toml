[package]
name = "telos-reth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
default-run = "telos-reth"

[lints]
workspace = true

[dependencies]
# reth
reth.workspace = true
reth-cli-util.workspace = true
reth-node-builder.workspace = true
reth-provider.workspace = true
reth-node-ethereum.workspace = true
reth-ethereum-cli.workspace = true
reth-rpc-server-types.workspace = true
reth-cli-commands.workspace = true
reth-cli-runner.workspace = true
reth-chainspec.workspace = true
reth-db-api.workspace = true
reth-db-common.workspace = true
reth-fs-util.workspace = true
reth-primitives-traits.workspace = true
reth-stages.workspace = true
reth-tasks.workspace = true
reth-trie.workspace = true
reth-trie-db.workspace = true

# telos
reth-node-telos.workspace = true
reth-telos-rpc.workspace = true

# cli
clap = { workspace = true, features = ["derive", "env"] }

# logging
tracing.workspace = true
eyre.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde", "std"] }
jsonrpsee.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "telos-reth"
path = "src/main.rs"

[[bin]]
name = "telos-checkpoint-bootstrap"
path = "src/bin/telos-checkpoint-bootstrap.rs"

[features]
default = ["jemalloc"]
jemalloc = [
    "reth-cli-util/jemalloc",
    "reth/jemalloc",
    "reth-ethereum-cli/jemalloc",
    "reth-provider/jemalloc",
]
jemalloc-prof = [
    "reth-cli-util/jemalloc-prof",
    "reth/jemalloc-prof",
    "reth-ethereum-cli/jemalloc-prof",
]
asm-keccak = [
    "reth/asm-keccak",
    "reth-node-ethereum/asm-keccak",
    "reth-ethereum-cli/asm-keccak",
    "alloy-primitives/asm-keccak",
]
