name: telos / release

on:
  push:
    tags:
      - "telos-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing telos-reth package version to build without publishing"
        required: true
        type: string

concurrency:
  group: telos-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/telosnetwork/telos-reth
  RUST_VERSION: "1.95.0"

jobs:
  metadata:
    name: validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source-commit: ${{ steps.release.outputs.source_commit }}
      source-date-epoch: ${{ steps.release.outputs.source_date_epoch }}
      upstream-release: ${{ steps.release.outputs.upstream_release }}
      upstream-commit: ${{ steps.release.outputs.upstream_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate tag, package, and upstream base
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag=$GITHUB_REF_NAME
            [[ "$tag" == telos-v* ]] || { echo "unexpected tag: $tag" >&2; exit 1; }
            version=${tag#telos-v}
            publish=true

            [[ "$(git cat-file -t "$tag")" == tag ]] || { echo "release tags must be annotated" >&2; exit 1; }
            tag_object=$(git rev-parse "${tag}^{tag}")
            verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')
            [[ "$verified" == true ]] || { echo "GitHub does not recognize $tag as a verified signed tag" >&2; exit 1; }
          else
            version=$REQUESTED_VERSION
            tag="telos-v${version}"
            publish=false
          fi

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "invalid release version: $version" >&2; exit 1; }

          package_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '[.packages[] | select(.name == "telos-reth") | .version] | if length == 1 then .[0] else error("expected exactly one telos-reth package") end')
          [[ "$version" == "$package_version" ]] \
            || { echo "tag version $version does not match telos-reth $package_version" >&2; exit 1; }

          if [[ "$publish" == true ]]; then
            matching_releases="${RUNNER_TEMP}/matching-releases.json"
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -s --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]' \
              > "$matching_releases"
            release_count=$(jq -r 'length' "$matching_releases")
            [[ "$release_count" -le 1 ]] \
              || { echo "multiple GitHub releases exist for $tag" >&2; exit 1; }
            if [[ "$release_count" == 1 ]]; then
              [[ "$(jq -r '.[0].draft' "$matching_releases")" == true ]] \
                || { echo "published GitHub release $tag already exists; refusing to alter it" >&2; exit 1; }
              echo "resuming the existing draft release for $tag"
            fi
          fi

          source_commit=$(git rev-parse HEAD)
          source_date_epoch=$(git show -s --format=%ct HEAD)
          if [[ "$publish" == true ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main \
              || { echo "release commit is not on origin/main" >&2; exit 1; }
          fi
          upstream_repository=$(jq -er .repository .github/telos/upstream-base.json)
          upstream_release=$(jq -er .release .github/telos/upstream-base.json)
          upstream_commit=$(jq -er .commit .github/telos/upstream-base.json)

          [[ "$upstream_repository" == https://github.com/paradigmxyz/reth ]] \
            || { echo "unexpected upstream repository: $upstream_repository" >&2; exit 1; }
          [[ "$upstream_release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$upstream_commit" HEAD \
            || { echo "declared upstream commit is not an ancestor" >&2; exit 1; }
          git fetch --no-tags "${upstream_repository}.git" \
            "refs/tags/${upstream_release}:refs/tags/telos-verified-upstream-base"
          [[ "$(git rev-parse 'refs/tags/telos-verified-upstream-base^{commit}')" == "$upstream_commit" ]] \
            || { echo "upstream release tag does not match its declared commit" >&2; exit 1; }

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "source_commit=$source_commit"
            echo "source_date_epoch=$source_date_epoch"
            echo "upstream_release=$upstream_release"
            echo "upstream_commit=$upstream_commit"
          } >> "$GITHUB_OUTPUT"

  binaries:
    name: binary / ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Build auditable binary in the pinned environment
        run: |
          docker buildx build \
            --file Dockerfile.telos \
            --target artifact \
            --platform "${{ matrix.platform }}" \
            --no-cache \
            --build-arg "SOURCE_COMMIT=${{ needs.metadata.outputs.source-commit }}" \
            --build-arg "SOURCE_DATE_EPOCH=${{ needs.metadata.outputs.source-date-epoch }}" \
            --build-arg "TELOS_VERSION=${{ needs.metadata.outputs.version }}" \
            --build-arg "UPSTREAM_RELEASE=${{ needs.metadata.outputs.upstream-release }}" \
            --build-arg "UPSTREAM_COMMIT=${{ needs.metadata.outputs.upstream-commit }}" \
            --output type=local,dest=release-binary \
            .
      - name: Check binary identity
        env:
          PUBLISH: ${{ needs.metadata.outputs.publish }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          binary="release-binary/telos-reth"
          test -x "$binary"
          "$binary" --version | grep -F "$VERSION"
          build_info=$("$binary" telos-build-info)
          jq -e '
            .schema == "telos-reth-build-info/v1" and
            (.execution_ready | type == "boolean") and
            (.rpc_replay_ready | type == "boolean")
          ' <<< "$build_info" >/dev/null
          if [[ "$PUBLISH" == true ]]; then
            jq -e '.execution_ready == true' <<< "$build_info" >/dev/null || {
              echo "refusing to publish a binary with the Telos execution qualification gate closed" >&2
              exit 1
            }
          fi
          test -x release-binary/telos-checkpoint-bootstrap
          release-binary/telos-checkpoint-bootstrap --help >/dev/null
          test -x release-binary/telos-rpc-router
          release-binary/telos-rpc-router --help >/dev/null
      - name: Package deterministic archive
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source-date-epoch }}
        run: |
          scripts/release/package-telos.sh \
            "release-binary/telos-reth" \
            "${{ needs.metadata.outputs.version }}" \
            "${{ matrix.target }}" \
            "${{ needs.metadata.outputs.source-commit }}" \
            "${{ needs.metadata.outputs.upstream-release }}" \
            "${{ needs.metadata.outputs.upstream-commit }}" \
            dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-binary
          format: spdx-json
          output-file: dist/telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.spdx.json
          syft-version: v1.48.0
          upload-artifact: false
          upload-release-assets: false
      - name: Generate per-platform checksums
        env:
          ASSET_ROOT: telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
        run: |
          (
            cd dist
            sha256sum \
              "${ASSET_ROOT}.tar.gz" \
              "${ASSET_ROOT}.spdx.json" \
              > "${ASSET_ROOT}.sha256"
          )
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  reproducibility:
    name: reproducibility / ${{ matrix.target }}
    needs: [metadata, binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: release-dist
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Independently rebuild the release binary
        run: |
          docker buildx build \
            --file Dockerfile.telos \
            --target artifact \
            --platform "${{ matrix.platform }}" \
            --no-cache \
            --build-arg "SOURCE_COMMIT=${{ needs.metadata.outputs.source-commit }}" \
            --build-arg "SOURCE_DATE_EPOCH=${{ needs.metadata.outputs.source-date-epoch }}" \
            --build-arg "TELOS_VERSION=${{ needs.metadata.outputs.version }}" \
            --build-arg "UPSTREAM_RELEASE=${{ needs.metadata.outputs.upstream-release }}" \
            --build-arg "UPSTREAM_COMMIT=${{ needs.metadata.outputs.upstream-commit }}" \
            --output type=local,dest=rebuild \
            .
      - name: Require a byte-identical rebuild
        env:
          ASSET_ROOT: telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source-date-epoch }}
        run: |
          set -euo pipefail
          (cd release-dist && sha256sum --check "${ASSET_ROOT}.sha256")
          scripts/release/package-telos.sh \
            rebuild/telos-reth \
            "${{ needs.metadata.outputs.version }}" \
            "${{ matrix.target }}" \
            "${{ needs.metadata.outputs.source-commit }}" \
            "${{ needs.metadata.outputs.upstream-release }}" \
            "${{ needs.metadata.outputs.upstream-commit }}" \
            rebuilt-dist
          cmp "release-dist/${ASSET_ROOT}.tar.gz" "rebuilt-dist/${ASSET_ROOT}.tar.gz"
          mkdir expected
          tar -xzf "release-dist/${ASSET_ROOT}.tar.gz" \
            --strip-components=1 \
            -C expected \
            "${ASSET_ROOT}/telos-reth" \
            "${ASSET_ROOT}/telos-checkpoint-bootstrap" \
            "${ASSET_ROOT}/telos-rpc-router"
          test -x expected/telos-reth
          test -x expected/telos-checkpoint-bootstrap
          test -x expected/telos-rpc-router
          test -x rebuild/telos-reth
          test -x rebuild/telos-checkpoint-bootstrap
          test -x rebuild/telos-rpc-router
          cmp expected/telos-reth rebuild/telos-reth
          cmp expected/telos-checkpoint-bootstrap rebuild/telos-checkpoint-bootstrap
          cmp expected/telos-rpc-router rebuild/telos-rpc-router
          sha256sum expected/telos-* rebuild/telos-*

  container-validation:
    name: validate container / ${{ matrix.arch }}
    needs: [metadata, binaries, reproducibility]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: release-dist
      - name: Verify and extract the reproducibility-approved binary
        env:
          ASSET_ROOT: telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          (cd release-dist && sha256sum --check "${ASSET_ROOT}.sha256")
          mkdir -p dist/container
          tar -xzf "release-dist/${ASSET_ROOT}.tar.gz" \
            --strip-components=1 \
            -C dist/container \
            "${ASSET_ROOT}/telos-reth"
          test -x dist/container/telos-reth
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Build the candidate runtime image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source-date-epoch }}
        with:
          context: .
          file: Dockerfile.telos
          target: runtime-prebuilt
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: telos-reth-validation:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          build-args: |
            SOURCE_COMMIT=${{ needs.metadata.outputs.source-commit }}
            TELOS_VERSION=${{ needs.metadata.outputs.version }}
            UPSTREAM_RELEASE=${{ needs.metadata.outputs.upstream-release }}
            UPSTREAM_COMMIT=${{ needs.metadata.outputs.upstream-commit }}
          provenance: false
          sbom: false
      - name: Execute the candidate runtime image
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          image_ref="telos-reth-validation:${VERSION}-${ARCH}"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$image_ref" --version | grep -F "$VERSION"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$image_ref" --help >/dev/null
      - name: Exercise local image SBOM generation
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docker:telos-reth-validation:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          format: spdx-json
          output-file: container-${{ matrix.arch }}.spdx.json
          syft-version: v1.48.0
          upload-artifact: false
          upload-release-assets: false
      - name: Block critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: telos-reth-validation:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          version: v0.72.0
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

  signed-binaries:
    name: sign verified binary / ${{ matrix.target }}
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, binaries, reproducibility, container-validation]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: production-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist
      - name: Recheck the reproducibility-approved bundle
        env:
          ASSET_ROOT: telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "${ASSET_ROOT}.sha256")
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign archive, SBOM, and checksums
        env:
          ASSET_ROOT: telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "dist/${ASSET_ROOT}.tar.gz.sigstore.json" \
            "dist/${ASSET_ROOT}.tar.gz"
          cosign sign-blob --yes \
            --bundle "dist/${ASSET_ROOT}.spdx.json.sigstore.json" \
            "dist/${ASSET_ROOT}.spdx.json"
          (
            cd dist
            sha256sum \
              "${ASSET_ROOT}.tar.gz" \
              "${ASSET_ROOT}.spdx.json" \
              "${ASSET_ROOT}.tar.gz.sigstore.json" \
              "${ASSET_ROOT}.spdx.json.sigstore.json" \
              > "${ASSET_ROOT}.sha256"
            cosign sign-blob --yes \
              --bundle "${ASSET_ROOT}.sha256.sigstore.json" \
              "${ASSET_ROOT}.sha256"
          )
      - name: Attest binary archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz
      - name: Attest binary archive SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz
          sbom-path: dist/telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  container:
    name: container / ${{ matrix.arch }}
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, signed-binaries, container-validation]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: production-release
    permissions:
      attestations: write
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ matrix.target }}
          path: release-dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify and extract attested binary
        env:
          ASSET_ROOT: telos-reth-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle "release-dist/${ASSET_ROOT}.sha256.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "release-dist/${ASSET_ROOT}.sha256"
          cosign verify-blob \
            --bundle "release-dist/${ASSET_ROOT}.tar.gz.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "release-dist/${ASSET_ROOT}.tar.gz"
          (cd release-dist && sha256sum --check "${ASSET_ROOT}.sha256")
          mkdir -p dist/container
          tar -xzf "release-dist/${ASSET_ROOT}.tar.gz" \
            --strip-components=1 \
            -C dist/container \
            "${ASSET_ROOT}/telos-reth"
          test -x dist/container/telos-reth
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Build architecture image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source-date-epoch }}
        with:
          context: .
          file: Dockerfile.telos
          target: runtime-prebuilt
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: telos-reth-release:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          build-args: |
            SOURCE_COMMIT=${{ needs.metadata.outputs.source-commit }}
            TELOS_VERSION=${{ needs.metadata.outputs.version }}
            UPSTREAM_RELEASE=${{ needs.metadata.outputs.upstream-release }}
            UPSTREAM_COMMIT=${{ needs.metadata.outputs.upstream-commit }}
          provenance: false
          sbom: false
      - name: Execute the candidate runtime image
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          image_ref="telos-reth-release:${VERSION}-${ARCH}"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$image_ref" --version | grep -F "$VERSION"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$image_ref" --help >/dev/null
      - name: Generate architecture image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docker:telos-reth-release:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          format: spdx-json
          output-file: container-${{ matrix.arch }}.spdx.json
          syft-version: v1.48.0
          upload-artifact: false
          upload-release-assets: false
      - name: Block critical image vulnerabilities before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: telos-reth-release:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          version: v0.72.0
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the scanned image under a run-scoped staging tag
        id: image
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source-commit }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          local_ref="telos-reth-release:${VERSION}-${ARCH}"
          staging_ref="${IMAGE_NAME}:staging-${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          if manifest_error=$(docker manifest inspect "$staging_ref" 2>&1); then
            echo "run-scoped container tag $staging_ref already exists; refusing to overwrite it" >&2
            exit 1
          elif ! grep -qiE 'manifest unknown|no such manifest|not found' <<< "$manifest_error"; then
            echo "$manifest_error" >&2
            echo "could not prove that run-scoped container tag $staging_ref is absent" >&2
            exit 1
          fi
          docker tag "$local_ref" "$staging_ref"
          docker push "$staging_ref" 2>&1 | tee push-output.txt
          digest=$(sed -nE \
            's/^.*digest: (sha256:[0-9a-f]{64}) .*$/\1/p' \
            push-output.txt | tail -n 1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "docker push did not return a valid registry digest" >&2; exit 1; }
          docker buildx imagetools inspect "${IMAGE_NAME}@${digest}" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir container-digest
          printf '%s@%s\n' "$IMAGE_NAME" "$digest" > container-digest/ref.txt
      - name: Sign architecture image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Attest architecture image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest architecture image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: container-${{ matrix.arch }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ matrix.arch }}
          path: container-digest/ref.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  container-manifest:
    name: multi-platform container
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: container-digests
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and validate a run-scoped image index
        id: manifest
        env:
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source-commit }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          amd64_ref=$(<container-digests/container-digest-amd64/ref.txt)
          arm64_ref=$(<container-digests/container-digest-arm64/ref.txt)
          ref_pattern='^ghcr\.io/telosnetwork/telos-reth@sha256:[0-9a-f]{64}$'
          [[ "$amd64_ref" =~ $ref_pattern ]] || { echo "invalid amd64 image reference: $amd64_ref" >&2; exit 1; }
          [[ "$arm64_ref" =~ $ref_pattern ]] || { echo "invalid arm64 image reference: $arm64_ref" >&2; exit 1; }
          [[ "$amd64_ref" != "$arm64_ref" ]] || { echo "architecture image digests must differ" >&2; exit 1; }

          staging_ref="${IMAGE_NAME}:staging-${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if manifest_error=$(docker manifest inspect "$staging_ref" 2>&1); then
            echo "run-scoped image-index tag $staging_ref already exists; refusing to overwrite it" >&2
            exit 1
          elif ! grep -qiE 'manifest unknown|no such manifest|not found' <<< "$manifest_error"; then
            echo "$manifest_error" >&2
            echo "could not prove that run-scoped image-index tag $staging_ref is absent" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --metadata-file manifest-metadata.json \
            --tag "$staging_ref" \
            "$amd64_ref" \
            "$arm64_ref"
          digest=$(jq -er \
            '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            manifest-metadata.json)
          docker buildx imagetools inspect --raw "${IMAGE_NAME}@${digest}" > manifest.json
          jq -e \
            '[.manifests[] | select(.platform.os != "unknown") | [.platform.os, .platform.architecture]]
             | sort == [["linux", "amd64"], ["linux", "arm64"]]' \
            manifest.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign image index
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Attest image index provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  draft-release:
    name: create draft release
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, binaries, container-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: write
      id-token: write
    outputs:
      asset-manifest-sha256: ${{ steps.release.outputs.asset_manifest_sha256 }}
      body-sha256: ${{ steps.release.outputs.body_sha256 }}
      release-id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-release-*
          path: release-dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify bundles and create aggregate checksums
        env:
          CONTAINER_DIGEST: ${{ needs.container-manifest.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source-commit }}
          TAG: ${{ needs.metadata.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.metadata.outputs.upstream-commit }}
          UPSTREAM_RELEASE: ${{ needs.metadata.outputs.upstream-release }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          issuer="https://token.actions.githubusercontent.com"
          (
            cd release-dist
            for checksums in *.sha256; do
              sha256sum --check "$checksums"
              cosign verify-blob \
                --bundle "${checksums}.sigstore.json" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "$issuer" \
                "$checksums"
            done
            for signed_file in *.tar.gz *.spdx.json; do
              cosign verify-blob \
                --bundle "${signed_file}.sigstore.json" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "$issuer" \
                "$signed_file"
            done
            cat > "telos-reth-${VERSION}-container.txt" <<EOF
          image=${IMAGE_NAME}@${CONTAINER_DIGEST}
          source_commit=${SOURCE_COMMIT}
          upstream_release=${UPSTREAM_RELEASE}
          upstream_commit=${UPSTREAM_COMMIT}
          EOF
            cosign sign-blob --yes \
              --bundle "telos-reth-${VERSION}-container.txt.sigstore.json" \
              "telos-reth-${VERSION}-container.txt"
            checksum_tmp="${RUNNER_TEMP}/telos-reth-SHA256SUMS"
            rm -f "$checksum_tmp"
            find . -maxdepth 1 -type f \
              ! -name SHA256SUMS \
              ! -name SHA256SUMS.sigstore.json \
              -print0 | sort -z | xargs -0 sha256sum > "$checksum_tmp"
            mv "$checksum_tmp" SHA256SUMS
            cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          )
      - name: Generate release notes
        env:
          CONTAINER_DIGEST: ${{ needs.container-manifest.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source-commit }}
          UPSTREAM_COMMIT: ${{ needs.metadata.outputs.upstream-commit }}
          UPSTREAM_RELEASE: ${{ needs.metadata.outputs.upstream-release }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          {
            echo "## Telos Reth ${VERSION}"
            echo
            echo "Source commit: \`${SOURCE_COMMIT}\`"
            echo
            echo "Upstream base: \`${UPSTREAM_RELEASE}\` (\`${UPSTREAM_COMMIT}\`)"
            echo
            echo "Container: \`${IMAGE_NAME}@${CONTAINER_DIGEST}\`"
            echo
            echo "### Changes since the upstream base"
            echo
            git log --no-merges --pretty='- %s (%h)' "${UPSTREAM_COMMIT}..${SOURCE_COMMIT}"
            echo
            echo "### Verification"
            echo
            echo "Every archive includes the execution client, checkpoint bootstrap, and retained-history RPC router. It has an SPDX SBOM, Sigstore bundle, SHA-256 checksum, and GitHub build attestation. See \`docs/telos/release.md\`."
          } > release-notes.md
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          prerelease_args=()
          [[ "$PRERELEASE" == true ]] && prerelease_args+=(--prerelease)

          release_json="${RUNNER_TEMP}/existing-release.json"
          release_error="${RUNNER_TEMP}/existing-release.error"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > "$release_json" 2> "$release_error"; then
            jq -e \
              --arg tag "$TAG" \
              --argjson prerelease "$PRERELEASE" \
              '.tag_name == $tag and .draft == true and .prerelease == $prerelease' \
              "$release_json" >/dev/null \
              || { echo "the existing release is not the expected resumable draft" >&2; exit 1; }
            gh release edit "$TAG" \
              --title "Telos Reth ${VERSION}" \
              --notes-file release-notes.md
            gh release upload "$TAG" release-dist/* --clobber
          elif grep -q 'HTTP 404' "$release_error"; then
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "Telos Reth ${VERSION}" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}" \
              release-dist/*
          else
            cat "$release_error" >&2
            exit 1
          fi

          final_release_json="${RUNNER_TEMP}/final-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$final_release_json"
          jq -e \
            --arg tag "$TAG" \
            --arg title "Telos Reth ${VERSION}" \
            --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .name == $title and .draft == true and .prerelease == $prerelease' \
            "$final_release_json" >/dev/null \
            || { echo "the finalized draft metadata does not match this release" >&2; exit 1; }
          jq -jer '.body' "$final_release_json" > "${RUNNER_TEMP}/actual-release-notes.md"
          cmp release-notes.md "${RUNNER_TEMP}/actual-release-notes.md"

          release_id=$(jq -er '.id | select(type == "number")' "$final_release_json")
          expected_assets="${RUNNER_TEMP}/expected-release-assets"
          actual_assets="${RUNNER_TEMP}/actual-release-assets"
          (
            cd release-dist
            while IFS= read -r -d '' asset; do
              asset_sha256=$(sha256sum "$asset" | cut -d ' ' -f 1)
              printf '%s\tsha256:%s\tuploaded\n' "$asset" "$asset_sha256"
            done < <(find . -maxdepth 1 -type f -printf '%f\0' | LC_ALL=C sort -z)
          ) > "$expected_assets"
          test -s "$expected_assets"
          gh api --paginate \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | [.name, .digest, .state] | @tsv' \
            | LC_ALL=C sort > "$actual_assets"
          cmp "$expected_assets" "$actual_assets"

          asset_manifest_sha256=$(sha256sum "$expected_assets" | cut -d ' ' -f 1)
          body_sha256=$(sha256sum release-notes.md | cut -d ' ' -f 1)
          {
            echo "asset_manifest_sha256=$asset_manifest_sha256"
            echo "body_sha256=$body_sha256"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"

  publish-container-tags:
    name: publish signed container tags
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, container-manifest, draft-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      attestations: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: container-digests
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify signed digests and promote semantic tags
        env:
          EXPECTED_ASSET_MANIFEST_SHA256: ${{ needs.draft-release.outputs.asset-manifest-sha256 }}
          EXPECTED_BODY_SHA256: ${{ needs.draft-release.outputs.body-sha256 }}
          EXPECTED_RELEASE_ID: ${{ needs.draft-release.outputs.release-id }}
          GH_TOKEN: ${{ github.token }}
          INDEX_DIGEST: ${{ needs.container-manifest.outputs.digest }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          issuer="https://token.actions.githubusercontent.com"
          ref_pattern='^ghcr\.io/telosnetwork/telos-reth@sha256:[0-9a-f]{64}$'

          [[ "$EXPECTED_RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ASSET_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BODY_SHA256" =~ ^[0-9a-f]{64}$ ]]

          verify_draft() {
            local release_json="${RUNNER_TEMP}/draft-release.json"
            local actual_assets="${RUNNER_TEMP}/actual-release-assets"
            local actual_body_sha256
            local actual_asset_manifest_sha256

            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json"
            jq -e \
              --arg tag "$TAG" \
              --arg title "Telos Reth ${VERSION}" \
              --argjson prerelease "$PRERELEASE" \
              --argjson release_id "$EXPECTED_RELEASE_ID" \
              '.id == $release_id and .tag_name == $tag and .name == $title and .draft == true and .prerelease == $prerelease' \
              "$release_json" >/dev/null \
              || { echo "the exact draft GitHub release must exist before container tag promotion" >&2; exit 1; }
            actual_body_sha256=$(jq -jer '.body' "$release_json" | sha256sum | cut -d ' ' -f 1)
            [[ "$actual_body_sha256" == "$EXPECTED_BODY_SHA256" ]] \
              || { echo "the draft release notes changed before container tag promotion" >&2; exit 1; }

            gh api --paginate \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}/assets?per_page=100" \
              --jq '.[] | [.name, .digest, .state] | @tsv' \
              | LC_ALL=C sort > "$actual_assets"
            actual_asset_manifest_sha256=$(sha256sum "$actual_assets" | cut -d ' ' -f 1)
            [[ "$actual_asset_manifest_sha256" == "$EXPECTED_ASSET_MANIFEST_SHA256" ]] \
              || { echo "the draft release assets changed before container tag promotion" >&2; exit 1; }
          }

          amd64_ref=$(<container-digests/container-digest-amd64/ref.txt)
          arm64_ref=$(<container-digests/container-digest-arm64/ref.txt)
          index_ref="${IMAGE_NAME}@${INDEX_DIGEST}"
          for ref in "$amd64_ref" "$arm64_ref" "$index_ref"; do
            [[ "$ref" =~ $ref_pattern ]] || { echo "invalid signed image reference: $ref" >&2; exit 1; }
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$ref" >/dev/null
            gh attestation verify "oci://${ref}" --repo "$GITHUB_REPOSITORY" >/dev/null
          done

          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }

          promote() {
            local target_ref=$1
            local source_ref=$2
            local expected_digest=${source_ref##*@}
            local inspect_error="${RUNNER_TEMP}/inspect-error"
            local actual_digest

            if actual_digest=$(inspect_digest "$target_ref" 2> "$inspect_error"); then
              [[ "$actual_digest" == "$expected_digest" ]] || {
                echo "existing tag $target_ref resolves to $actual_digest, expected $expected_digest" >&2
                exit 1
              }
            elif grep -qiE 'manifest unknown|not found' "$inspect_error"; then
              docker buildx imagetools create \
                --prefer-index=false \
                --tag "$target_ref" \
                "$source_ref"
            else
              cat "$inspect_error" >&2
              echo "could not determine whether $target_ref already exists" >&2
              exit 1
            fi

            actual_digest=$(inspect_digest "$target_ref")
            [[ "$actual_digest" == "$expected_digest" ]] || {
              echo "promoted tag $target_ref resolves to $actual_digest, expected $expected_digest" >&2
              exit 1
            }
          }

          verify_draft
          promote "${IMAGE_NAME}:${VERSION}-amd64" "$amd64_ref"
          verify_draft
          promote "${IMAGE_NAME}:${VERSION}-arm64" "$arm64_ref"
          # The multi-platform version tag is last: every digest is signed and attested,
          # and the draft release is already complete before it becomes discoverable.
          verify_draft
          promote "${IMAGE_NAME}:${VERSION}" "$index_ref"
