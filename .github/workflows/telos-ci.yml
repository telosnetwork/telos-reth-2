name: telos / ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.95.0"
  NIGHTLY_VERSION: nightly-2026-07-17

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07-20)
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy and binary smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1.1.0
      - run: .github/scripts/install_llvm.sh ubuntu
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Discover production-critical packages
        id: packages
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '
                def shared: [
                  "reth-db-common",
                  "reth-engine-tree",
                  "reth-evm",
                  "reth-rpc",
                  "reth-rpc-builder",
                  "reth-rpc-eth-api"
                ];
                [.packages[] | select(.manifest_path | contains("/crates/telos/")) | .name]
                  as $telos
                | [.packages[].name] as $all
                | (shared - $all) as $missing
                | if ($telos | length) == 0 then error("no Telos packages found")
                  elif ($missing | length) != 0 then error("missing shared packages: \($missing | join(","))")
                  else ($telos + shared) | unique | join(",")
                  end' \
            | xargs -I{} echo "names={}" >> "$GITHUB_OUTPUT"
      - name: Lint Telos and modified shared packages
        env:
          PACKAGE_NAMES: ${{ steps.packages.outputs.names }}
        run: |
          set -euo pipefail
          IFS=',' read -ra packages <<< "$PACKAGE_NAMES"
          cargo_args=()
          for package in "${packages[@]}"; do
            cargo_args+=(--package "$package")
          done
          cargo clippy --locked --all-targets --all-features "${cargo_args[@]}" -- -D warnings
      - name: Build and inspect the production binary
        run: |
          cargo build --locked --package telos-reth --bin telos-reth
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '[.packages[] | select(.name == "telos-reth") | .version] | if length == 1 then .[0] else error("expected exactly one telos-reth package") end')
          ./target/debug/telos-reth --version | grep -F "$version"
          ./target/debug/telos-reth --help >/dev/null
          ./target/debug/telos-reth telos-sidecar-schedule --help >/dev/null
          ./target/debug/telos-reth telos-build-info \
            | jq -e '
                .schema == "telos-reth-build-info/v1" and
                (.execution_ready | type == "boolean") and
                (.rpc_replay_ready | type == "boolean")
              ' >/dev/null
          mkdir ci-container
          install -m 0755 target/debug/telos-reth ci-container/telos-reth
          strip ci-container/telos-reth
          printf '%s\n' "$version" > ci-container/version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telos-ci-binary
          path: ci-container/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  test:
    name: Telos unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1.1.0
      - run: .github/scripts/install_llvm.sh ubuntu
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Test Telos and modified shared packages
        run: |
          set -euo pipefail
          readarray -t packages < <(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -er '
                  def shared: [
                    "reth-db-common",
                    "reth-engine-tree",
                    "reth-evm",
                    "reth-rpc",
                    "reth-rpc-builder",
                    "reth-rpc-eth-api"
                  ];
                  [.packages[] | select(.manifest_path | contains("/crates/telos/")) | .name]
                    as $telos
                  | [.packages[].name] as $all
                  | (shared - $all) as $missing
                  | if ($telos | length) == 0 then error("no Telos packages found")
                    elif ($missing | length) != 0 then error("missing shared packages: \($missing | join(","))")
                    else ($telos + shared) | unique[]
                    end' \
              | sort -u
          )
          ((${#packages[@]} >= 6)) || { echo "package discovery is incomplete" >&2; exit 1; }
          cargo_args=()
          for package in "${packages[@]}"; do
            cargo_args+=(--package "$package")
          done
          cargo nextest run --locked --all-features --no-fail-fast "${cargo_args[@]}"

  container-definition:
    name: container definition
    needs: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telos-ci-binary
          path: ci-container
      - name: Build the release runtime stage
        run: |
          set -euo pipefail
          upstream_release=$(jq -er .release .github/telos/upstream-base.json)
          upstream_commit=$(jq -er .commit .github/telos/upstream-base.json)
          git merge-base --is-ancestor "$upstream_commit" HEAD
          mkdir -p dist/container
          install -m 0755 ci-container/telos-reth dist/container/telos-reth
          docker build \
            --file Dockerfile.telos \
            --target runtime-prebuilt \
            --tag telos-reth:ci \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "TELOS_VERSION=0.0.0-ci" \
            --build-arg "UPSTREAM_RELEASE=${upstream_release}" \
            --build-arg "UPSTREAM_COMMIT=${upstream_commit}" \
            .
      - name: Verify runtime invariants
        run: |
          set -euo pipefail
          test "$(docker image inspect telos-reth:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
          test "$(docker image inspect telos-reth:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/telos-reth"]'
          container_id=$(docker create telos-reth:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker export --output "${RUNNER_TEMP}/telos-reth-rootfs.tar" "$container_id"
          tar -tf "${RUNNER_TEMP}/telos-reth-rootfs.tar" etc/ssl/certs/ca-certificates.crt >/dev/null
          version=$(<ci-container/version)
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            telos-reth:ci --version | grep -F "$version"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            telos-reth:ci --help >/dev/null

  operations-assets:
    name: operations assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check scripts and deterministic release contents
        run: |
          set -euo pipefail
          bash -n \
            ops/scripts/* \
            ops/tests/*.sh \
            scripts/release/*.sh \
            scripts/telos/checkpoint/*.sh \
            scripts/telos/checkpoint/legacy-extractor/build-exact-legacy-extractor.sh
          python3 ops/tests/test_restore_transaction.py
          python3 ops/tests/test_history_router_assets.py
          python3 ops/tests/test_history_router_readiness.py
          bash ops/tests/test_snapshot_data_verification.sh
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          for path in Path("scripts/telos/checkpoint").glob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          for root in (Path("ops/scripts"), Path("scripts/telos/checkpoint")):
              for path in root.iterdir():
                  if not path.is_file():
                      continue
                  lines = path.read_text(encoding="utf-8").splitlines()
                  start = None
                  for number, line in enumerate(lines, 1):
                      if start is None and "<<'PY'" in line:
                          start = number + 1
                      elif start is not None and line == "PY":
                          compile("\n".join(lines[start - 1:number - 1]) + "\n", f"{path}:{start}", "exec")
                          start = None
                  if start is not None:
                      raise SystemExit(f"unterminated Python heredoc in {path}:{start - 1}")

          checkpoint_root = Path("ops/checkpoints/telos-mainnet/479294328")
          local_checkpoint_files = (
              "checkpoint.json",
              "legacy-extractor.provenance.json",
              "mdbx-check.log",
              "mdbx-copy.json",
              "native-anchor.attestation.json",
              "state.legacy-evidence.json",
          )
          checksum_lines = (checkpoint_root / "SHA256SUMS").read_text(encoding="utf-8").splitlines()
          for name in local_checkpoint_files:
              matches = [line for line in checksum_lines if line.endswith(f"  {name}")]
              if len(matches) != 1:
                  raise SystemExit(f"expected one local SHA256SUMS entry for {name}, got {len(matches)}")
              expected, recorded_name = matches[0].split("  ", 1)
              if recorded_name != name or len(expected) != 64:
                  raise SystemExit(f"malformed local SHA256SUMS entry for {name}")
              actual = sha256((checkpoint_root / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"local checkpoint digest mismatch for {name}")
          PY
          find ops/scripts scripts/release scripts/telos/checkpoint -maxdepth 1 -type f \
            ! -perm /111 -print -quit | grep -q . && {
              echo "an operational/release script is not executable" >&2
              exit 1
            }
          test -x scripts/telos/checkpoint/legacy-extractor/build-exact-legacy-extractor.sh
          test -f scripts/telos/checkpoint/legacy-extractor/src/main.rs
          test ! -L scripts/telos/checkpoint/legacy-extractor/src/main.rs
          sudo install -d -m 0755 /usr/local/libexec
          sudo install -m 0755 ops/scripts/* /usr/local/libexec/
          sudo install -m 0755 /bin/true /usr/local/bin/telos-reth
          sudo install -m 0755 /bin/true /usr/local/bin/telos-rpc-router
          sudo install -m 0755 /bin/true /usr/local/bin/telos-consensus-client
          systemd-sysusers --dry-run "$GITHUB_WORKSPACE/ops/sysusers.d/telos-reth.conf"
          sudo systemd-sysusers "$GITHUB_WORKSPACE/ops/sysusers.d/telos-reth.conf"
          systemd-analyze verify ops/systemd/*.service ops/systemd/*.timer
          sudo env TELOS_RESTORE_INTEGRATION_DISPOSABLE_CI=1 \
            bash ops/tests/test_restore_integration.sh

          mkdir -p package-input package-a package-b
          install -m 0755 /bin/true package-input/telos-reth
          install -m 0755 /bin/true package-input/telos-checkpoint-bootstrap
          install -m 0755 /bin/true package-input/telos-rpc-router
          export SOURCE_DATE_EPOCH=1700000000
          package_args=(
            package-input/telos-reth 0.1.0 x86_64-unknown-linux-gnu
            0123456789abcdef0123456789abcdef01234567 v2.4.1
            89abcdef0123456789abcdef0123456789abcdef
          )
          scripts/release/package-telos.sh "${package_args[@]}" package-a
          scripts/release/package-telos.sh "${package_args[@]}" package-b
          archive=telos-reth-0.1.0-x86_64-unknown-linux-gnu.tar.gz
          cmp "package-a/${archive}" "package-b/${archive}"
          tar -tzf "package-a/${archive}" \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/telos-checkpoint-bootstrap \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/telos-rpc-router \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/scripts/telos/checkpoint/legacy-extractor/build-exact-legacy-extractor.sh \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/scripts/telos/checkpoint/legacy-extractor/src/main.rs \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/scripts/telos-reth-restore \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/checkpoints/telos-mainnet/479294328/checkpoint.json \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/docs/telos/checkpoint-bootstrap.md \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/docs/telos/compatibility.md \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/docs/telos/history-routing.md \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/config/mainnet-router.env.example \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/config/mainnet-archive.env.example \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/config/mainnet-archive-consensus.toml.example \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/systemd/telos-reth-archive@.service \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/systemd/telos-reth-archive-consensus@.service \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/scripts/telos-reth-archive-run \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/scripts/telos-reth-archive-consensus-run \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/systemd/telos-rpc-router@.service \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/systemd/telos-rpc-router-readiness@.service \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/systemd/telos-rpc-router-readiness@.timer \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/scripts/telos-rpc-router-preflight \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/ops/scripts/telos-rpc-router-readiness \
            >/dev/null
          mkdir package-inspect
          tar -xzf "package-a/${archive}" --strip-components=1 -C package-inspect \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/BUILD-METADATA \
            telos-reth-0.1.0-x86_64-unknown-linux-gnu/telos-rpc-router
          test -x package-inspect/telos-rpc-router
          grep -Fxq "format_version=4" package-inspect/BUILD-METADATA
          router_sha256=$(sha256sum package-inspect/telos-rpc-router | cut -d ' ' -f 1)
          grep -Fxq "rpc_router_sha256=${router_sha256}" package-inspect/BUILD-METADATA
          mv package-input/telos-rpc-router package-input/telos-rpc-router.missing
          if scripts/release/package-telos.sh "${package_args[@]}" package-missing-router; then
            echo "packaging succeeded without telos-rpc-router" >&2
            exit 1
          fi

  ci-success:
    name: telos / ci success
    if: always()
    needs: [format, clippy, test, container-definition, operations-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CONTAINER_RESULT: ${{ needs.container-definition.result }}
          OPERATIONS_RESULT: ${{ needs.operations-assets.result }}
        run: |
          test "$FORMAT_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success
          test "$OPERATIONS_RESULT" = success
