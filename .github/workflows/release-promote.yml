name: telos / promote

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable version to promote or restore"
        required: true
        type: string
      confirm:
        description: "Type promote to move the latest tag"
        required: true
        type: string

concurrency:
  group: telos-promote-latest
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_NAME: ghcr.io/telosnetwork/telos-reth

jobs:
  promote:
    name: promote stable image
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Validate published release
        id: release
        env:
          CONFIRM: ${{ inputs.confirm }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            [[ "$EVENT_PRERELEASE" == false ]]
            tag=$EVENT_TAG
          else
            [[ "$CONFIRM" == promote ]] || { echo "confirmation must be exactly: promote" >&2; exit 1; }
            tag="telos-v${REQUESTED_VERSION}"
            release_json=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
            jq -e '.isDraft == false and .isPrerelease == false' <<< "$release_json" >/dev/null \
              || { echo "$tag is not a published stable release" >&2; exit 1; }
          fi

          [[ "$tag" == telos-v* ]] || { echo "not a Telos release tag: $tag" >&2; exit 1; }
          version=${tag#telos-v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "only stable SemVer releases may be promoted: $version" >&2; exit 1; }
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify the release-recorded image digest
        id: recorded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          asset="telos-reth-${VERSION}-container.txt"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --pattern "${asset}.sigstore.json" \
            --dir release-metadata
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          cosign verify-blob \
            --bundle "release-metadata/${asset}.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "release-metadata/${asset}"
          recorded_image=$(sed -n 's/^image=//p' "release-metadata/${asset}")
          [[ "$recorded_image" =~ ^ghcr\.io/telosnetwork/telos-reth@(sha256:[0-9a-f]{64})$ ]] \
            || { echo "release asset has an invalid image reference" >&2; exit 1; }
          echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote immutable release image
        id: image
        env:
          DIGEST: ${{ steps.recorded.outputs.digest }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools create \
            --dry-run \
            --metadata-file version-metadata.json \
            "${IMAGE_NAME}:${VERSION}" >/dev/null
          version_digest=$(jq -er \
            '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            version-metadata.json)
          [[ "$version_digest" == "$DIGEST" ]] \
            || { echo "version tag no longer matches the signed release digest" >&2; exit 1; }
          docker buildx imagetools create \
            --metadata-file promotion-metadata.json \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${DIGEST}"
          promoted_digest=$(jq -er \
            '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            promotion-metadata.json)
          [[ "$promoted_digest" == "$DIGEST" ]] \
            || { echo "latest tag did not resolve to the release digest" >&2; exit 1; }
          echo "digest=$promoted_digest" >> "$GITHUB_OUTPUT"
      - name: Sign promoted image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Attest promotion
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
