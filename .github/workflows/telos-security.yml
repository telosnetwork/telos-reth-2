name: telos / security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * MON"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  dependency-policy:
    name: advisories, sources, and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-20)
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@0.20.2
      - name: Enforce dependency policy
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo deny --all-features check advisories bans licenses sources

  dependency-review:
    name: dependency diff review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false

  docs-dependency-policy:
    name: documentation dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: v1.3.8
      - name: Enforce the locked documentation dependency policy
        working-directory: docs/vocs
        run: |
          bun install --frozen-lockfile --ignore-scripts
          # GHSA-frvp-7c67-39w9 is a Windows-only serve-static traversal in the nested
          # @modelcontextprotocol/sdk Hono adapter. Vocs does not import or bundle that adapter,
          # and this Linux static build serves no files through it. No patched 1.x release exists.
          bun audit --ignore GHSA-frvp-7c67-39w9

  security-success:
    name: telos / security success
    if: always()
    needs: [dependency-policy, dependency-review, docs-dependency-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require security policy jobs
        env:
          POLICY_RESULT: ${{ needs.dependency-policy.result }}
          REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DOCS_RESULT: ${{ needs.docs-dependency-policy.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$REVIEW_RESULT" = success -o "$REVIEW_RESULT" = skipped
          test "$DOCS_RESULT" = success
